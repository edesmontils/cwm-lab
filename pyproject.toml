[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cwm-lab"
version = "0.5.4"
description = "CWM Lab — local web dashboard over CWM 2.0: N3/Turtle parsing, forward-chaining reasoning, SPARQL, proofs, triple graph, AI data generation — semantic web teaching lab (FR/EN) (outil de TP Web sémantique)"
readme = "README.md"
# Licence : Apache-2.0 (voir LICENSE). Le moteur CWM 2.0, dépendance,
# est sous licence W3C Software (code d'origine) / Apache-2.0
# (modifications du fork) — voir le dépôt CWM.
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [
    {name = "Emmanuel Desmontils", email = "emmanuel.desmontils@univ-nantes.fr"},
]
maintainers = [
    {name = "Emmanuel Desmontils", email = "emmanuel.desmontils@univ-nantes.fr"},
]
keywords = [
    # recherche PyPI : les termes techniques (EN) viennent en tête
    "cwm", "semantic-web", "rdf", "n3", "turtle", "sparql",
    "reasoner", "forward-chaining", "knowledge-graph", "ontology",
    "proof", "triple-graph", "education", "teaching", "lab",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
# Seule dépendance : CWM 2.0 (fork, publié sur PyPI sous le nom « cwm »,
# dépôt source : https://gitlab.univ-nantes.fr/desmontils-e/cwm).
dependencies = [
    "cwm>=2.9.3",
]

[project.urls]
Homepage = "https://github.com/edesmontils/cwm-lab"
Repository = "https://github.com/edesmontils/cwm-lab"
"Bug Tracker" = "https://github.com/edesmontils/cwm-lab/issues"
"CWM 2.0 (moteur)" = "https://gitlab.univ-nantes.fr/desmontils-e/cwm"

# Lancement en commande : cwm-lab [--port N] [--host H]
[project.scripts]
cwm-lab = "cwm_lab.server:main"

[tool.setuptools]
packages = ["cwm_lab"]

# Le frontend (static/), les exercices, les prompts IA (affinables à
# la main) et les exemples de config voyagent avec le paquet
# (installable hors dépôt, cwm_lab/ seul).
[tool.setuptools.package-data]
cwm_lab = [
    "static/**/*",
    "exercises/**/*",
    "prompts/**/*",
    "config.yaml.example",
    ".env.example",
]
